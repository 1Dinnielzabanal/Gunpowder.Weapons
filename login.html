<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — gunpowder.weapon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root{
    --iron:#171512;
    --iron-deep:#0f0e0c;
    --panel:#1c1a16;
    --steel:#3b3833;
    --steel-light:#5c584f;
    --brass:#c9a568;
    --brass-bright:#e3c081;
    --parchment:#e9e0c8;
    --parchment-dim:#b9ae8f;
    --oxblood:#7c2c20;
    --oxblood-bright:#a5402f;
    --rule: rgba(201,165,104,0.25);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--iron);
    color:var(--parchment);
    font-family:'EB Garamond', serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    position:relative;
    overflow:hidden;
  }
  h1,h2{font-family:'Cormorant Garamond', serif; font-weight:600; margin:0;}
  a{color:inherit;}

  /* ---------- TEXTURED BACKGROUND ---------- */
  body::before{
    content:"";
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(201,165,104,0.08), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(124,44,32,0.12), transparent 55%),
      linear-gradient(180deg, var(--iron) 0%, var(--iron-deep) 100%);
    z-index:0;
  }
  body::after{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    opacity:0.05;
    mix-blend-mode:overlay;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 2px, #000 3px),
      repeating-linear-gradient(90deg, transparent, transparent 2px, #000 3px);
    z-index:0;
  }

  /* ---------- BRAND (above card) ---------- */
  .brand-lockup{
    position:relative; z-index:1;
    display:flex; flex-direction:column; align-items:center;
    gap:14px;
    margin-bottom:32px;
  }
  .brand-mark{width:38px; height:38px;}
  .brand-name{font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:700; letter-spacing:0.03em;}
  .brand-name span{color:var(--brass);}

  .auth-wrap{
    position:relative; z-index:1;
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---------- CARD ---------- */
  .auth-card{
    width:100%;
    background:linear-gradient(180deg, #1c1a16, #14120f);
    border:1px solid var(--rule);
    padding:44px 38px 38px;
    box-shadow:0 30px 70px rgba(0,0,0,0.55);
  }
  .card-rule{
    width:48px; height:1px;
    background:var(--brass);
    margin:0 auto 22px;
  }
  .auth-card .eyebrow{
    display:block; text-align:center;
    font-family:'Special Elite', monospace;
    font-size:11px; letter-spacing:0.2em; text-transform:uppercase;
    color:var(--brass);
    margin-bottom:10px;
  }
  .auth-card h2{
    text-align:center;
    font-size:30px;
    margin-bottom:8px;
  }
  .auth-card .subtitle{
    text-align:center;
    font-style:italic;
    font-size:15px;
    color:var(--parchment-dim);
    margin-bottom:32px;
  }

  /* ---------- FORM ---------- */
  form{display:flex; flex-direction:column; gap:20px;}
  .field label{
    display:block;
    font-family:'Special Elite', monospace;
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--brass);
    margin-bottom:8px;
  }
  .field input{
    width:100%;
    background:var(--iron-deep);
    border:1px solid var(--steel);
    color:var(--parchment);
    font-family:'EB Garamond', serif;
    font-size:16px;
    padding:13px 14px;
    outline:none;
    transition:border-color .2s;
  }
  .field input::placeholder{color:var(--steel-light); font-style:italic;}
  .field input:focus{border-color:var(--brass);}

  .field-row{
    display:flex;
    justify-content:flex-end;
    margin-top:-8px;
  }
  .forgot-link{
    font-family:'Special Elite', monospace;
    font-size:11px; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--parchment-dim);
    border-bottom:1px solid transparent;
  }
  .forgot-link:hover{color:var(--brass-bright); border-color:var(--brass);}

  .btn-primary{
    margin-top:8px;
    width:100%;
    background:var(--oxblood);
    border:1px solid var(--oxblood);
    color:var(--parchment);
    font-family:'Special Elite', monospace;
    font-size:13px; letter-spacing:0.14em; text-transform:uppercase;
    padding:15px;
    cursor:pointer;
    transition:background .2s, border-color .2s;
  }
  .btn-primary:hover{background:var(--oxblood-bright); border-color:var(--oxblood-bright);}

  /* ---------- DIVIDER ---------- */
  .divider{
    display:flex; align-items:center; gap:14px;
    margin:28px 0 22px;
    color:var(--steel-light);
    font-family:'Special Elite', monospace;
    font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
  }
  .divider::before, .divider::after{
    content:"";
    flex:1; height:1px;
    background:var(--rule);
  }

  /* ---------- SSO BUTTONS ---------- */
  .sso-group{display:flex; flex-direction:column; gap:12px;}
  .btn-sso{
    display:flex; align-items:center; justify-content:center; gap:10px;
    background:transparent;
    border:1px solid var(--steel);
    color:var(--parchment-dim);
    font-family:'EB Garamond', serif;
    font-size:15px;
    padding:12px;
    cursor:pointer;
    transition:border-color .2s, color .2s;
  }
  .btn-sso:hover{border-color:var(--brass); color:var(--brass-bright);}
  .btn-sso svg{width:18px; height:18px; flex:none;}

  /* ---------- FOOTER LINK ---------- */
  .switch-auth{
    text-align:center;
    margin-top:30px;
    font-size:15px;
    color:var(--parchment-dim);
  }
  .switch-auth a{
    color:var(--brass-bright);
    border-bottom:1px solid var(--brass);
    padding-bottom:1px;
  }
  .switch-auth a:hover{color:var(--brass);}

  .back-home{
    position:relative; z-index:1;
    margin-top:26px;
    font-family:'Special Elite', monospace;
    font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--steel-light);
  }
  .back-home:hover{color:var(--parchment-dim);}

  @media (max-width:480px){
    .auth-card{padding:34px 24px 30px;}
  }
</style>
</head>
<body>

  <div class="brand-lockup">
    <svg class="brand-mark" viewBox="0 0 40 40" fill="none" stroke="var(--brass)" stroke-width="1.4">
      <circle cx="20" cy="20" r="17"/>
      <path d="M8 20 L32 20 M20 8 L20 32" stroke-width="0.8" opacity="0.6"/>
      <path d="M13 24 L27 24 L25 16 L15 16 Z"/>
    </svg>
    <div class="brand-name">gunpowder<span>.weapon</span></div>
  </div>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="card-rule"></div>
      <span class="eyebrow">Welcome Back</span>
      <h2>Sign In</h2>
      <p class="subtitle">Access your saved specimens and research notes.</p>

      <form action="#" method="POST">
        <div class="field">
          <label for="identifier">Email or Username</label>
          <input type="text" id="identifier" name="identifier" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <div class="field-row">
          <a class="forgot-link" href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-primary">Log In</button>
      </form>

      <div class="divider">Or continue with</div>

      <div class="sso-group">
        <button class="btn-sso" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12s3.36-7.27 7.19-7.27c3.08 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.19 2C6.42 2 2.03 6.8 2.03 12s4.39 10 10.16 10c5.08 0 9.81-3.55 9.81-10 0-1-.14-1.6-.14-1.6z"/></svg>
          Continue with Google
        </button>
      </div>

      <p class="switch-auth">Don't have an account? <a href="/register.html">Register here</a></p>
    </div>
  </div>

  <a class="back-home" href="/">← Back to gunpowder.weapon</a>

</body>
</html>
